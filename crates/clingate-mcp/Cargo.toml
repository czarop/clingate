[package]
name = "clingate-mcp"
version = "0.1.0"
edition = "2024"
description = "clingate's tools for Claude, over the Model Context Protocol."

[[bin]]
name = "clingate-mcp"
path = "src/main.rs"

[dependencies]
clingate-core = { path = "../clingate-core" }
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
# To stderr: stdout carries the protocol.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
clingate-core = { path = "../clingate-core", features = ["test-support"] }
rand = "0.10"
rand_distr = "0.6"
