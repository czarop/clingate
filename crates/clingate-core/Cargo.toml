[package]
name = "clingate-core"
version = "0.1.0"
edition = "2024"
description = "Everything clingate computes - FCS files, compensation, gates, rules - with no window."

# Built by the desktop app and by anything driving clingate without one. It
# must never depend on the renderer, the webview or GTK: only the reactive
# core, so the stores the app watches can be declared here.
[dependencies]
dioxus-stores = "0.7.10"
dioxus-signals = "0.7.10"
thiserror = "2.0.12"
anyhow = "1"
# Diagnostics. Never printed to stdout: a tool server speaks its protocol
# there, and a stray line would corrupt it.
tracing = "0.1"
# Pinned to czarop/flow's `claude/fcs-errors-not-panics` branch, which holds
# the fixes and changes listed in docs/flow-review.md. Back to the default
# branch once it is merged there.
flow-fcs = { git = "https://github.com/czarop/flow", rev = "b7a77c4e674a3fbd98290fee3ca9e65d28df45ba" }
flow-plots = { git = "https://github.com/czarop/flow", rev = "b7a77c4e674a3fbd98290fee3ca9e65d28df45ba", default-features = false }
flow-gates = { git = "https://github.com/czarop/flow", rev = "b7a77c4e674a3fbd98290fee3ca9e65d28df45ba" }
rustc-hash = "2.1"
indexmap = "2.1"
polars = {version = "0.53", default-features = false, features = ["lazy", "performant", "csv", "temporal"]}
rayon = "1"
im = "15"
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Where the last workspace is remembered.
dirs = "6.0.0"
itertools = "0.15.0"
rustfft = "^6.4"
rand = "0.10"
rand_distr = "0.6"
# When a rules run was applied, in its kept record. Already built for polars.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[features]
# The FCS writers and scratch folders the tests use, for the app's tests too.
test-support = []
