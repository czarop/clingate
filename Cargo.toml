[package]
name = "clingate"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
thiserror = "2.0.12"
tokio = { version = "1", default-features = false, features = ["macros", "sync", "rt-multi-thread", "time"] }
anyhow = "1"
# Pinned to czarop/flow's `claude/fcs-errors-not-panics` branch: flow_fcs refuses
# damaged files instead of panicking, keeps a file's own $GUID and reads
# delimiters escaped inside keyword values; flow_gates' event index leaves out
# NaN events and its pixel mapping returns None rather than panicking;
# flow_plots bins the density on the plotting area and draws PNG. Back to the
# default branch once it is merged there.
flow-fcs = { git = "https://github.com/czarop/flow", rev = "41315d05736acd5a773be5e5ddf5ef6f94732329" }
flow-plots = { git = "https://github.com/czarop/flow", rev = "41315d05736acd5a773be5e5ddf5ef6f94732329", default-features = false }
flow-gates = { git = "https://github.com/czarop/flow", rev = "41315d05736acd5a773be5e5ddf5ef6f94732329" }
base64 = "0.23.1"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
rustc-hash = "2.1"
indexmap = "2.1"
polars = {version = "0.53", default-features = false, features = ["lazy", "performant", "csv", "temporal"]}
rayon = "1"
im = "15"
uuid = { version = "1.0", features = ["v4"] }
serde = {version = "1"}
serde_json = "1"
# Where the last workspace is remembered. Already in the tree - wry and
# tray-icon depend on it - and pinned to the same version, so this adds nothing
# to compile.
dirs = "6.0.0"
itertools = "0.15.0"
rustfft = "^6.4"
rand = "0.10"
rand_distr = "0.6"
# The native file dialogs. Already in the tree, since dioxus-desktop depends on
# it; pinned to its version and features so there is only ever one copy.
#
# The features are not a choice. rfd's build script refuses `gtk3` and
# `xdg-portal` together, and dioxus-desktop requires `xdg-portal`, so that is
# the backend whether or not it suits - and it is a separate D-Bus service that
# a machine may not be running. `PickPath` handles that: see the note there
# about a dialog that closes faster than a person could have closed it.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
# Only to decode the plots the renderer draws, so tests can look at them.
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

# The application is a desktop window and cannot be built without one. Saying
# so lets `cargo test --no-default-features` build the library and every test
# target without GTK; without it, cargo builds the binary for the integration
# tests and fails on `dioxus::desktop`.
[[bin]]
name = "clingate"
path = "src/main.rs"
required-features = ["desktop"]
